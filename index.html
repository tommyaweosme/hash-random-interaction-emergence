<!DOCTYPE html> <html> <head> <title>hash random interaction emergence</title> <style> .hotbar-btn { width:24px; height:24px; display:inline-block; border:2px solid #555; margin:2px; cursor:pointer; border-radius:4px; text-align:center; line-height:24px; color:#fff; font-weight:bold; font-size:12px; } .hotbar-btn.active { border-color:#fff; box-shadow: 0 0 5px #fff; } </style> </head> <body> <div> states (max 100): <input id="states" value="5" onchange="generateHotbar()"><br> seed: <input id="seeds" value="5"><br> hash depth: <select id="depth"><option value="32">32-bit (default)</option><option value="128">128-bit (expanded)</option></select><br> <button onclick="run()">reset & run</button> <button id="pauseBtn" onclick="togglePause()">pause</button> <button onclick="clearBoard()">clear board</button> <button onclick="randomizeBoard()">randomize board</button><span id="speedDisplay">cells: 0 | speed: 0.1s</span><br> <div style="margin-top:5px;"><strong>Hotbar:</strong> <span id="hotbarContainer"></span></div> </div> <div id="playfield" style="position:absolute;top:15%;left:15%;height:70%;width:70%;background-color:#202020;z-index:1;overflow:hidden;"></div> <script> let timeoutId = null; let isPaused = false; let selectedState = 0; const styleSheet = document.createElement("style"); let cssRules = ""; for (let i = 0; i < 100; i++) { let hue = (i * 137.5) % 360; cssRules += `.c${i} { background-color: hsv(${hue}, 100%, 100%); background-color: hsl(${hue}, 100%, 50%); }\n`; } styleSheet.innerText = cssRules; document.head.appendChild(styleSheet); function hashRandom32(seedString) { let hash = 0x811c9dc5; for (let i = 0; i < seedString.length; i++) { hash ^= seedString.charCodeAt(i); hash = Math.imul(hash, 0x01000193); } return ((hash ^ (hash >>> 16)) >>> 0) / 4294967296; } function hashRandom128(seedString) { let h1 = hashRandom32(seedString + "-a"); let h2 = hashRandom32(seedString + "-b"); let h3 = hashRandom32(seedString + "-c"); let h4 = hashRandom32(seedString + "-d"); return (h1 * 0.25) + (h2 * 0.25) + (h3 * 0.25) + (h4 * 0.25); } function generateHotbar() { let states = Math.min(100, Math.max(1, Number(document.getElementById("states").value) || 1)); let container = document.getElementById("hotbarContainer"); container.innerHTML = ""; let eraser = document.createElement("div"); eraser.className = "hotbar-btn"; eraser.style.backgroundColor = "#555"; eraser.innerText = "X"; eraser.title = "Eraser Tool"; eraser.onclick = () => selectTool(-1, eraser); container.appendChild(eraser); for (let i = 0; i < states; i++) { let btn = document.createElement("div"); btn.className = `hotbar-btn c${i}`; btn.innerText = i; btn.onclick = () => selectTool(i, btn); if (i === selectedState) btn.classList.add("active"); container.appendChild(btn); } } function selectTool(stateNum, element) { selectedState = stateNum; document.querySelectorAll(".hotbar-btn").forEach(b => b.classList.remove("active")); element.classList.add("active"); } function togglePause() { isPaused = !isPaused; document.getElementById("pauseBtn").innerText = isPaused ? "resume" : "pause"; if (!isPaused && timeoutId === null) { simulationTick(); } } function clearBoard() { document.getElementById("playfield").innerHTML = ""; updateDisplayCount(); } function randomizeBoard() {let playfield = document.getElementById("playfield");playfield.innerHTML = ""; let states = Math.min(100, Math.max(1, Number(document.getElementById("states").value) || 1));let cellBuffer = "";for (let i = 0; i < 150; i++) {let rx = Math.floor(Math.random() * 100);let ry = Math.floor(Math.random() * 100);let rState = Math.floor(Math.random() * states);let nextId = Math.floor(Math.random() * 1000000);cellBuffer += `<div class="particle c${rState}" data-id="${nextId}" style="position:absolute; width:1%; height:1%; z-index:100; top:${ry}%; left:${rx}%;"></div>`;}playfield.insertAdjacentHTML('beforeend', cellBuffer);updateDisplayCount();}document.getElementById("playfield").addEventListener("click", function(e) { let rect = this.getBoundingClientRect(); let pctX = Math.floor(((e.clientX - rect.left) / rect.width) * 100); let pctY = Math.floor(((e.clientY - rect.top) / rect.height) * 100); let existing = document.querySelector(`.particle[style*="top:${pctY}%"][style*="left:${pctX}%"]`); if (selectedState === -1) { if (existing) existing.remove(); } else { if (existing) existing.remove(); let randClass = Math.random(); let nextId = Math.floor(randClass * 1000000); let cellHTML = `<div class="particle c${selectedState}" data-id="${nextId}" style="position:absolute; width:1%; height:1%; z-index:100; top:${pctY}%; left:${pctX}%;"></div>`; this.insertAdjacentHTML('beforeend', cellHTML); } updateDisplayCount(); }); function updateDisplayCount() { const total = document.querySelectorAll(".particle").length; let dynamicDelay = Math.max(100, (total * 0.15)); document.getElementById("speedDisplay").innerText = `cells: ${total} | speed: ${(Math.round(dynamicDelay))/1000}s`; } function simulationTick() { if (isPaused) { timeoutId = null; return; } const elements = document.querySelectorAll(".particle"); const currentTotal = elements.length; let htmlBuffer = ""; let states = Number(document.getElementById("states").value); let worldseed = document.getElementById("seeds").value; let hashDepth = document.getElementById("depth").value; let hashRandom = (hashDepth === "128") ? hashRandom128 : hashRandom32; const gridMap = {}; elements.forEach((element) => { const top = (element.style.top !== "") ? parseInt(element.style.top) : 50; const left = (element.style.left !== "") ? parseInt(element.style.left) : 50; gridMap[`${top}_${left}`] = (gridMap[`${top}_${left}`] || 0) + 1; }); elements.forEach((element) => { let colorState = 0; element.classList.forEach(className => { if (className.startsWith("c")) { colorState = parseInt(className.substring(1)) || 0; } }); const topStyle = element.style.top; const leftStyle = element.style.left; const currentTop = (topStyle !== "") ? parseInt(topStyle) : 50; const currentLeft = (leftStyle !== "") ? parseInt(leftStyle) : 50; let neighborCount = 0; for (let dTop = -1; dTop <= 1; dTop++) { for (let dLeft = -1; dLeft <= 1; dLeft++) { if (dTop === 0 && dLeft === 0) continue; const checkTop = (currentTop + dTop + 100) % 100; const checkLeft = (currentLeft + dLeft + 100) % 100; if (gridMap[`${checkTop}_${checkLeft}`]) { neighborCount += gridMap[`${checkTop}_${checkLeft}`]; } } } if (neighborCount >= 3) { element.remove(); return; } let localSeedModifier = neighborCount > 0 ? `-${neighborCount}n` : ""; const spawnRand = hashRandom(`${worldseed}-${colorState}${localSeedModifier}-spawn`); const spawnCount = spawnRand < 0.5 ? 1 : 2; for (let s = 0; s < spawnCount; s++) { const randTop = hashRandom(`${worldseed}-${colorState}${localSeedModifier}-${s}-top`); const randLeft = hashRandom(`${worldseed}-${colorState}${localSeedModifier}-${s}-left`); const randClass = hashRandom(`${worldseed}-${colorState}${localSeedModifier}-${s}-class`); const newTop = ((currentTop + (Math.floor(randTop * 3) - 1)) + 100) % 100; const newLeft = ((currentLeft + (Math.floor(randLeft * 3) - 1)) + 100) % 100; const nextId = Math.floor(randClass * 1000000); const nextColorClass = "c" + Math.floor(randClass * states); htmlBuffer += `<div class="particle ${nextColorClass}" data-id="${nextId}" style="position:absolute; width:1%; height:1%; z-index:100; top:${newTop}%; left:${newLeft}%;"></div>`; } element.remove(); }); if (htmlBuffer !== "") { document.getElementById("playfield").insertAdjacentHTML('beforeend', htmlBuffer); } updateDisplayCount(); let dynamicDelay = Math.max(100, (document.querySelectorAll(".particle").length * 0.15)); timeoutId = setTimeout(simulationTick, dynamicDelay); } function run(){ if (timeoutId !== null) { clearTimeout(timeoutId); } isPaused = false; document.getElementById("pauseBtn").innerText = "pause"; document.getElementById("playfield").innerHTML = "<div class=\"particle c0\" style=\"position:absolute;width:1%;height:1%;top:50%;left:50%;\"></div>"; generateHotbar(); timeoutId = setTimeout(simulationTick, 100); } generateHotbar(); </script> </body> </html>
